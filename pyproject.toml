[project]
name = "subs"
version = "0.1.0"
description = "A simple subscription tracking app"
readme = "README.md"
authors = [
    { name = "juraj326" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-limiter[redis]>=4.1.1",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "icalendar>=7.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.vercel.scripts]
build = "npm ci && npm run build"
